console_title_template = '{{ .Shell }} in {{ .Folder }}'
final_space            = true
shell_integration      = true
version                = 4

[palette]
black  = '#000000'
blue   = '#4B95E9'
green  = '#59C9A5'
red    = '#D81E5B'
white  = '#FFFFFF'
yellow = '#F3AE35'
grey   = '#D3D7CF'
cyan   = '#21c7c7'

[upgrade]
source   = 'cdn'
interval = '168h'
auto     = false
notice   = false

[[blocks]]
type      = 'prompt'
alignment = 'left'
newline   = true

	[[blocks.segments]]
	background      = '#d3d7cf'
	foreground      = 'p:black'
	leading_diamond = '╭─'
	style           = 'diamond'
	template        = ' {{.Icon}}'
	type            = 'os'

	[[blocks.segments]]
	template         = '  {{ path .Path .Location }} '
	foreground       = '#e4e4e4'
	powerline_symbol = ''
	background       = '#3465a4'
	type             = 'path'
	style            = 'powerline'

		[blocks.segments.options]
		style = 'full'

	[[blocks.segments]]
	template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}'
	foreground = 'p:black'
	powerline_symbol = ''
	background = 'p:green'
	type = 'git'
	style = 'powerline'
	background_templates = [
		'{{ if or (.Working.Changed) (.Staging.Changed) }}p:yellow{{ end }}',
		'{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}',
		'{{ if gt .Ahead 0 }}#49416D{{ end }}',
		'{{ if gt .Behind 0 }}#7A306C{{ end }}',
	]
	foreground_templates = [
		'{{ if or (.Working.Changed) (.Staging.Changed) }}p:black{{ end }}',
		'{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:white{{ end }}',
		'{{ if gt .Ahead 0 }}p:white{{ end }}',
	]

		[blocks.segments.options]
		branch_template = '{{ trunc 25 .Branch }}'
		branch_icon     = ' '

	[[blocks.segments]]
	template         = '  '
	foreground       = 'p:white'
	powerline_symbol = ''
	background       = 'p:yellow'
	type             = 'root'
	style            = 'powerline'

[[blocks]]
type = 'rprompt'

	[[blocks.segments]]
	background       = '#c4a000'
	foreground       = 'p:black'
	leading_diamond  = ''
	invert_powerline = true
	style            = 'diamond'
	template         = ' {{ .FormattedMs }}  '
	type             = 'executiontime'

	[[blocks.segments]]
	leading_diamond      = ''
	trailing_diamond     = ''
	template             = ' {{ if gt .Code 0 }} {{.Code}}{{ else }}{{ end }} '
	foreground           = 'p:white'
	background           = 'p:blue'
	type                 = 'status'
	style                = 'diamond'
	background_templates = ['{{ if gt .Code 0 }}p:red{{ end }}']

		[blocks.segments.options]
		always_enabled = true

	[[blocks.segments]]
	template         = ' {{ .CurrentDate | date "15:04:05" }}'
	foreground       = 'p:black'
	background       = 'p:grey'
	leading_diamond  = ' '
	trailing_diamond = ''
	type             = 'time'
	style            = 'diamond'

[[blocks]]
alignment = 'left'
newline   = true
type      = 'prompt'

	[[blocks.segments]]
	foreground           = 'p:grey'
	foreground_templates = ['{{ if gt .Code 0 }}p:red{{ end }}']
	style                = 'plain'
	template             = '╰─'
	type                 = 'text'

[transient_prompt]
foreground = 'cyan'
background = 'transparent'
template   = ' '
